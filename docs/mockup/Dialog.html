<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hộp thoại chèn từ quy trình chuẩn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
  body { margin: 0; }
  a { color: #0D8FA0; }
  a:hover { color: #0A7382; }
</style>
</head>
<body>
<div style="width: 620px; height: 544px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: 20px; box-shadow: 0 24px 60px -20px rgba(13,42,45,.42); overflow: hidden; font-family: 'Be Vietnam Pro', sans-serif; color: #0D2A2D;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px 20px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600;">Chèn từ quy trình chuẩn</h2>
      <span style="font-size: 12.5px; color: #64797D;">Lưu trình đang có 3 bước.</span>
    </div>
    <button type="button" aria-label="Đóng" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: none; border-radius: 10px; background: #F4F8F7; color: #47605F; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.6 4.6l8.8 8.8M13.4 4.6l-8.8 8.8"></path></svg></button>
  </div>

  <div style="padding: 0 20px 12px 20px;">
    <div style="display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 13px; border: 1px solid #E4EEEB; border-radius: 11px;">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="#64797D" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.4"></circle><path d="M12 12l3.4 3.4"></path></svg>
      <label for="d-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Tìm quy trình chuẩn</label>
      <input id="d-q" type="search" placeholder="Tìm quy trình chuẩn…" style="flex-grow: 1; min-width: 0; border: none; outline: none; font-family: inherit; font-size: 13.5px; color: #0D2A2D; background: transparent;">
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 20px; overflow: hidden;">

    <button type="button" aria-pressed="true" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 13px 14px; border: 1px solid #A6DDD4; border-radius: 13px; background: #F4FBF9; text-align: left; font-family: inherit; cursor: pointer;">
      <span style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: linear-gradient(135deg, #17BFA8 0%, #0D8FA0 100%); flex-shrink: 0; margin-top: 1px;">
        <svg width="12" height="12" viewBox="0 0 18 18" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 9.4 7.3 12.9 14.2 5.6"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 600;">Mạ kẽm kiềm – thụ động – nhuộm màu</span>
        <span style="font-size: 12.5px; color: #4C6A6B;">10 bước · Tiền xử lí, Mạ kẽm kiềm, Rửa nước, Tẩy sáng, Thụ động, Nhuộm màu…</span>
      </span>
    </button>

    <button type="button" aria-pressed="false" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 13px 14px; border: 1px solid #E9F0EE; border-radius: 13px; background: #ffffff; text-align: left; font-family: inherit; cursor: pointer;">
      <span style="width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid #D3E0DD; flex-shrink: 0; margin-top: 1px;"></span>
      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 600;">Mạ kẽm kiềm – thụ động xanh trắng</span>
        <span style="font-size: 12.5px; color: #64797D;">9 bước · Tiền xử lí, Tẩy dầu điện hóa, Tẩy gỉ, Mạ kẽm kiềm, Thụ động…</span>
      </span>
    </button>

    <button type="button" aria-pressed="false" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 13px 14px; border: 1px solid #E9F0EE; border-radius: 13px; background: #ffffff; text-align: left; font-family: inherit; cursor: pointer;">
      <span style="width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid #D3E0DD; flex-shrink: 0; margin-top: 1px;"></span>
      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 600;">Mạ kẽm – thụ động cầu vồng</span>
        <span style="font-size: 12.5px; color: #64797D;">8 bước · Tiền xử lí, Mạ kẽm kiềm, Tẩy sáng, Thụ động cầu vồng, Sấy…</span>
      </span>
    </button>

    <button type="button" aria-pressed="false" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 13px 14px; border: 1px solid #E9F0EE; border-radius: 13px; background: #ffffff; text-align: left; font-family: inherit; cursor: pointer;">
      <span style="width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid #D3E0DD; flex-shrink: 0; margin-top: 1px;"></span>
      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <span style="font-size: 14px; font-weight: 600;">Mạ nickel bóng nền thép</span>
        <span style="font-size: 12.5px; color: #64797D;">7 bước · Tiền xử lí, Tẩy dầu điện hóa, Hoạt hóa, Mạ nickel bóng, Sấy…</span>
      </span>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 20px 18px 20px; margin-top: 12px; border-top: 1px solid #EEF4F3;">
    <span style="flex-grow: 1; font-size: 12px; color: #64797D; line-height: 1.4;">Thay toàn bộ sẽ xóa 3 bước bạn đã nhập.</span>
    <button type="button" style="height: 38px; padding: 0 16px; border: 1px solid #E4EEEB; border-radius: 11px; background: #ffffff; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #3E5A5C; cursor: pointer;">Thay toàn bộ các bước</button>
    <button type="button" style="height: 38px; padding: 0 18px; border: none; border-radius: 11px; background: linear-gradient(135deg, #17BFA8 0%, #0D8FA0 100%); color: #ffffff; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 18px -8px rgba(13,143,160,.8);">Chèn vào cuối</button>
  </div>

</div>
</body>
</html>
