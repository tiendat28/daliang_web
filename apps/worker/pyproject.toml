[project]
name = "daliang-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4",
  "boto3>=1.35",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pytesseract>=0.3.13",
  "pdf2image>=1.17",
  "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extract", "ocr", "preview"]
