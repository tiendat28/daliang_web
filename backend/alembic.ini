# Alembic - thay doi DB co version. Chay trong container backend:
#   alembic upgrade head                      # dua DB len ban moi nhat (tu chay khi khoi dong)
#   alembic revision --autogenerate -m "..."  # tao ban thay doi moi tu models.py
[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# URL lay tu app.core.config (bien moi truong DATABASE_URL), khong ghi o day

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
