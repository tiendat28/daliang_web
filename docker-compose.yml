services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: docs
      POSTGRES_DB: docs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docs
      MINIO_ROOT_PASSWORD: docs12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  worker:
    build: ./apps/worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - redis
      - minio

volumes:
  pgdata:
  miniodata: